<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>도매 인사이트</title>
<link rel="apple-touch-icon" href="icon-옷장.png">
<link rel="icon" href="icon-옷장.png">
<style>
:root{
  --navy:#14236D;
  --navy-soft:#3B4A85;
  --pink:#E35BA5;
  --c1:#E7CCD1;
  --c2:#F7BDCB;
  --c3:#FFE0CE;
  --c4:#F5A8D6;
  --c5:#FBC7D4;
  --c6:#BAA6C1;
  --card-bg: rgba(255,255,255,0.58);
  --card-bg-strong: rgba(255,255,255,0.78);
  --card-border: rgba(255,255,255,0.65);
  --gray: #8b8b95;
  --danger:#eb5757;
  --ok:#4fa07a;
  --radius: 18px;
  --app-max: 520px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{ margin:0; padding:0; height:100%; font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; color:var(--navy); }
body{
  min-height:100vh; display:flex; justify-content:center;
  background: #faf8f5;
  --accent: var(--pink);
  --modal-bg: #FBF7FB;
}


#app{ width:100%; max-width: var(--app-max); min-height:100vh; position:relative; padding-bottom: 100px; }
.topbar{
  position:sticky; top:0; z-index:30; padding: 18px 18px 12px;
  display:flex; align-items:center; justify-content:space-between;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  background: rgba(255,255,255,0.22);
}
.topbar h1{ font-size:19px; margin:0; font-weight:800; letter-spacing:-0.3px; color:var(--navy); }
.topbar .sub{ font-size:11px; color:var(--navy-soft); margin-top:2px; font-weight:500;}
.icon-btn{
  width:38px; height:38px; border-radius:12px; border:none;
  background: var(--card-bg); backdrop-filter: blur(10px);
  display:flex; align-items:center; justify-content:center;
  font-size:17px; cursor:pointer; color:var(--navy);
  box-shadow: 0 2px 8px rgba(20,35,109,0.08);
}
.icon-btn:active{ transform: scale(0.94); }

.tab-panel{ display:none; padding: 4px 16px 20px; }
.tab-panel.active{ display:block; }

.search-box{
  display:flex; align-items:center; gap:8px;
  background: var(--card-bg); backdrop-filter: blur(10px);
  border: 1px solid var(--card-border); border-radius: 14px; padding: 10px 14px; margin: 10px 0 12px;
}
.search-box input{ border:none; background:transparent; outline:none; flex:1; font-size:14px; color:var(--navy); font-family:inherit; }
.search-box input::placeholder{ color:#a9a9c2; }
.search-box .ic{ font-size:15px; opacity:0.6; }

.chip-row{ display:flex; gap:8px; overflow-x:auto; padding: 2px 0 12px; scrollbar-width:none; }
.chip-row::-webkit-scrollbar{ display:none; }
.chip{
  flex-shrink:0; padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer;
  background: rgba(255,255,255,0.5); border:1px solid rgba(255,255,255,0.7);
  color: var(--navy-soft); white-space:nowrap; transition: all .15s ease;
}
.chip.active{ background: var(--accent); color:#fff; border-color:var(--accent); box-shadow: 0 3px 10px rgba(20,35,109,0.18); }
.chip.add-chip{ background: transparent; border:1.5px dashed var(--navy-soft); color:var(--navy-soft); }

/* ---------- Item cards (Tab1) ---------- */
.item-card{ display:flex; gap:12px; padding:12px; background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--card-border); border-radius: var(--radius); margin-bottom:10px; cursor:pointer; }
.item-card:active{ transform: scale(0.985); }
.item-thumb{ width:66px; height:66px; border-radius:14px; object-fit:cover; flex-shrink:0; background: linear-gradient(135deg, var(--c1), var(--c5)); }
.item-thumb.empty{ display:flex; align-items:center; justify-content:center; font-size:22px; color:#fff; opacity:0.85; }
.item-info{ flex:1; min-width:0; }
.item-top{ display:flex; align-items:center; gap:6px; margin-bottom:3px; }
.cat-badge{ font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px; color:#fff; flex-shrink:0; }
.item-name{ font-size:15px; font-weight:700; color:var(--navy); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item-meta{ font-size:11.5px; color:var(--gray); margin-top:3px; }
.item-price{ font-size:14px; font-weight:800; color:var(--pink); margin-top:5px; }

.empty-state{ text-align:center; padding: 60px 20px; color:var(--navy-soft); }
.empty-state .emoji{ font-size:36px; margin-bottom:10px; }
.empty-state p{ font-size:13px; margin:4px 0; opacity:0.8; }

/* ---------- Simple list card (도매상/사입/위시) ---------- */
.wl-card{ display:flex; align-items:center; gap:10px; padding: 13px 14px; background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--card-border); border-radius: var(--radius); margin-bottom:9px; cursor:pointer; }
.wl-card:active{ transform: scale(0.985); }
.wl-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.wl-text{ flex:1; min-width:0; }
.wl-text .wl-name{ font-size:15px; font-weight:700; color:var(--navy); }
.wl-text .wl-loc{ font-size:10px; color:var(--gray); margin-top:3px; font-weight:500; }
.wl-arrow{ margin-left:auto; color:#c3b9d6; font-size:16px; flex-shrink:0; }

/* ---------- Order lines (주문내역) ---------- */
.order-date-head{ font-size:12px; font-weight:700; color:var(--navy-soft); padding: 10px 2px 6px; }
.order-line{ display:flex; align-items:center; gap:10px; padding:12px 13px; background: var(--card-bg); backdrop-filter: blur(10px); border:1px solid var(--card-border); border-radius: var(--radius); margin-bottom:8px; cursor:pointer; }
.order-line:active{ transform: scale(0.985); }
.order-line .ol-info{ flex:1; min-width:0; }
.order-line .ol-name{ font-size:14px; font-weight:700; color:var(--navy); }
.order-line .ol-opt{ font-size:11px; color:var(--gray); margin-top:3px; }
.order-line .ol-sub{ font-size:11px; color:var(--gray); margin-top:2px; }
.status-chip{ flex-shrink:0; padding:6px 11px; border-radius:999px; font-size:11px; font-weight:700; }
.status-chip.back{ background:#fde3e8; color:var(--danger); }
.status-chip.done{ background:#e2f3ea; color:var(--ok); }

/* ---------- Wish cards ---------- */
.wish-card{ display:flex; gap:12px; padding:13px; background: var(--card-bg); backdrop-filter: blur(10px); border:1px solid var(--card-border); border-radius: var(--radius); margin-bottom:10px; cursor:pointer; }
.wish-card:active{ transform: scale(0.985); }
.wish-emoji{ width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg,#F0E9A0,#FBFAD8); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.wish-info{ flex:1; min-width:0; }
.wish-info .wi-name{ font-size:14.5px; font-weight:700; color:var(--navy); }
.wish-info .wi-sub{ font-size:11.5px; color:var(--gray); margin-top:3px; }
.wish-info .wi-price{ font-size:13.5px; font-weight:800; color:var(--pink); margin-top:4px; }

/* ---------- Saip cards (사입삼촌) ---------- */
.saip-card{ padding:14px; background: var(--card-bg); backdrop-filter: blur(10px); border:1px solid var(--card-border); border-radius: var(--radius); margin-bottom:10px; cursor:pointer; }
.saip-card:active{ transform: scale(0.985); }
.saip-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.saip-date{ font-size:13.5px; font-weight:800; color:var(--navy); }
.saip-badges span{ font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px; margin-left:4px; }
.b-daenap{ background:#dce8fb; color:#3a5fa8; }
.b-wannap{ background:#e2f3ea; color:var(--ok); }
.b-none{ background:#f3eef4; color:#b3a9b6; }
.saip-meta{ font-size:11.5px; color:var(--gray); }
.saip-total{ font-size:15px; font-weight:800; color:var(--pink); margin-top:6px; }

/* dynamic item rows in saip form */
.saip-row{ background:#fff; border:1.5px solid #ecdff0; border-radius:14px; padding:12px; margin-bottom:10px; position:relative; }
.saip-row .row-num{ font-size:11px; font-weight:700; color:var(--gray); margin-bottom:8px; }
.saip-row .row-del{ position:absolute; top:10px; right:10px; border:none; background:#fbe4e8; color:var(--danger); width:24px; height:24px; border-radius:8px; font-size:12px; cursor:pointer; }

/* ---------- Quote tab (견적계산) ---------- */
.quote-form{ background: var(--card-bg-strong); backdrop-filter: blur(10px); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 14px; margin: 10px 0 16px; }
.quote-form .row2{ display:flex; gap:8px; margin-top:8px; }
.quote-group{ margin-bottom: 16px; }
.quote-group-head{ display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; font-weight:700; color:var(--navy-soft); padding: 0 2px 6px; }
.quote-group-head .sub-total{ color:var(--pink); font-weight:800; }
.quote-item{ display:flex; align-items:center; gap:10px; background: var(--card-bg); border:1px solid var(--card-border); border-radius:14px; padding:10px 12px; margin-bottom:7px; }
.quote-item .qi-info{ flex:1; min-width:0; }
.quote-item .qi-name{ font-size:13.5px; font-weight:700; color:var(--navy); }
.quote-item .qi-sub{ font-size:11px; color:var(--gray); margin-top:2px; }
.quote-item .qi-total{ font-size:13.5px; font-weight:800; color:var(--navy); }
.qi-del{ border:none; background:transparent; color:var(--danger); font-size:17px; cursor:pointer; padding:2px 4px; }
.quote-total-bar{ position:sticky; bottom: 88px; z-index:20; margin-top:14px; background: var(--accent); color:#fff; border-radius: 16px; padding: 14px 18px; display:flex; justify-content:space-between; align-items:center; box-shadow: 0 8px 20px rgba(20,35,109,0.25); }
.quote-total-bar .label{ font-size:12px; opacity:0.9; }
.quote-total-bar .amount{ font-size:19px; font-weight:800; }
.quote-total-bar button{ border:none; background:rgba(255,255,255,0.25); color:#fff; font-size:11.5px; padding:7px 12px; border-radius:10px; font-weight:700; cursor:pointer; }

/* ---------- Bottom tab bar ---------- */
.tabbar{
  position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
  width: calc(100% - 24px); max-width: calc(var(--app-max) - 24px);
  display:flex; background: rgba(255,255,255,0.55);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-radius: 20px; padding:5px; box-shadow: 0 8px 24px rgba(20,35,109,0.15);
  z-index:40; border:1px solid rgba(255,255,255,0.6);
}
.tab-btn{ flex:1; border:none; background:transparent; padding:8px 2px; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; border-radius:13px; color: var(--navy-soft); font-family:inherit; }
.tab-btn .t-ic{ font-size:16px; }
.tab-btn .t-label{ font-size:9px; font-weight:700; }
.tab-btn.active{ background: var(--accent); color:#fff; }

/* ---------- FAB ---------- */
.fab{ position:fixed; right:50%; bottom: 96px; transform: translateX(calc(var(--app-max)/2 - 56px)); width:52px; height:52px; border-radius:50%; border:none; background: var(--accent); color:#fff; font-size:26px; cursor:pointer; box-shadow: 0 8px 18px rgba(20,35,109,0.3); z-index:39; display:flex; align-items:center; justify-content:center; transition: background 0.25s ease; }
@media (max-width: 560px){ .fab{ transform:none; right:20px; } }
.fab:active{ transform: scale(0.92); }

/* ---------- Modal ---------- */
.modal-overlay{ position:fixed; inset:0; background:rgba(20,15,35,0.42); backdrop-filter: blur(3px); z-index:100; display:none; align-items:flex-end; justify-content:center; }
.modal-overlay.open{ display:flex; }
.modal-sheet{ width:100%; max-width: var(--app-max); background: var(--modal-bg, #FBF7FB); border-radius: 24px 24px 0 0; max-height: 90vh; overflow-y:auto; padding: 18px 18px 30px; animation: slideUp .25s ease; }
@keyframes slideUp{ from{ transform:translateY(30px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
.modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.modal-head h2{ font-size:17px; margin:0; font-weight:800; color:var(--navy); }
.modal-close{ border:none; background:rgba(20,35,109,0.06); width:32px; height:32px; border-radius:10px; font-size:15px; cursor:pointer; color:var(--navy); }

.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12px; font-weight:700; color:var(--navy-soft); margin-bottom:6px; }
.field input[type=text], .field input[type=number], .field input[type=date], .field textarea, .field select{
  width:100%; padding:11px 13px; border-radius:12px; border:1.5px solid #ecdff0; font-size:14px; font-family:inherit; background:#fff; color:var(--navy); outline:none;
}
.field input:focus, .field textarea:focus, .field select:focus{ border-color: var(--accent); }
.field textarea{ resize:vertical; min-height:60px; }
.field-row{ display:flex; gap:10px; }
.field-row > div{ flex:1; }

.select-chip-group{ display:flex; flex-wrap:wrap; gap:7px; }
.select-chip{ padding:8px 13px; border-radius:999px; font-size:12.5px; font-weight:600; background:#fff; border:1.5px solid #ecdff0; color:var(--navy-soft); cursor:pointer; }
.select-chip.sel{ background:var(--accent); border-color:var(--accent); color:#fff; }

.photo-row{ display:flex; gap:8px; flex-wrap:wrap; }
.photo-slot{ width:76px; height:76px; border-radius:14px; position:relative; overflow:hidden; background:#f2e9f3; border:1.5px dashed #d9c6dd; display:flex; align-items:center; justify-content:center; color:#b79dbb; font-size:22px; cursor:pointer; flex-shrink:0; }
.photo-slot img{ width:100%; height:100%; object-fit:cover; }
.photo-slot .rm{ position:absolute; top:2px; right:2px; width:19px; height:19px; border-radius:50%; background:rgba(0,0,0,0.55); color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; border:none; cursor:pointer; }

.modal-actions{ display:flex; gap:10px; margin-top:18px; }
.btn{ flex:1; padding:13px; border-radius:14px; border:none; font-size:14.5px; font-weight:700; cursor:pointer; font-family:inherit; }
.btn-primary{ background: var(--accent); color:#fff; }
.btn-secondary{ background:#f0e8f1; color:var(--navy-soft); }
.btn-danger{ background:#fbe4e8; color:var(--danger); }
.btn-outline{ background:transparent; border:1.5px dashed var(--navy-soft); color:var(--navy-soft); }
.btn:active{ transform: scale(0.97); }

.detail-photo-scroll{ display:flex; gap:8px; overflow-x:auto; margin-bottom:16px; }
.detail-photo-scroll img{ width:150px; height:150px; border-radius:16px; object-fit:cover; flex-shrink:0; }
.detail-row{ display:flex; justify-content:space-between; padding:10px 2px; border-bottom:1px solid #f0e6f1; font-size:13.5px; }
.detail-row .k{ color:var(--gray); font-weight:600; }
.detail-row .v{ color:var(--navy); font-weight:700; text-align:right; max-width:65%; }
.badge-pay{ display:inline-block; padding:4px 10px; border-radius:8px; font-size:11.5px; font-weight:700; background: var(--c3); color:var(--navy); margin: 2px 4px 2px 0; }
.account-box{ display:flex; justify-content:space-between; align-items:center; background:#f6eef6; border-radius:12px; padding:12px 14px; margin-top:6px; }
.account-box .num{ font-size:14px; font-weight:700; color:var(--navy); }
.copy-btn{ border:none; background:var(--accent); color:#fff; font-size:11px; font-weight:700; padding:6px 10px; border-radius:8px; cursor:pointer;}

.fee-box{ background:#f6eef6; border-radius:14px; padding:14px; margin-top:6px; }
.fee-row{ display:flex; justify-content:space-between; font-size:13px; padding:5px 0; color:var(--navy-soft); }
.fee-row.total{ border-top:1.5px dashed #ddc9de; margin-top:6px; padding-top:10px; font-size:15px; font-weight:800; color:var(--navy); }
.saip-item-table{ font-size:12.5px; }
.sit-row{ background:#fff; border-radius:12px; padding:10px 12px; margin-bottom:7px; }
.sit-row .sit-name{ font-weight:700; color:var(--navy); font-size:13.5px; }
.sit-row .sit-sub{ color:var(--gray); margin-top:3px; }

.status-toggle-row{ display:flex; gap:8px; }
.status-toggle{ flex:1; text-align:center; padding:10px; border-radius:12px; font-size:13px; font-weight:700; cursor:pointer; border:1.5px solid #ecdff0; color:var(--navy-soft); background:#fff; }
.status-toggle.on-daenap.sel{ background:#dce8fb; border-color:#a7c0ed; color:#3a5fa8; }
.status-toggle.on-wannap.sel{ background:#e2f3ea; border-color:#9ed7b8; color:var(--ok); }

.toast{ position:fixed; left:50%; bottom:160px; transform:translateX(-50%); background:rgba(20,20,30,0.85); color:#fff; padding:10px 18px; border-radius:12px; font-size:12.5px; z-index:200; opacity:0; transition:opacity .2s ease; pointer-events:none; }
.toast.show{ opacity:1; }
.settings-sync-info{ font-size:11.5px; color:var(--gray); margin-top:4px; }
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <div>
      <h1>도매 인사이트</h1>
      <div class="sub" id="headerSub">구매 기록 &amp; 구매처 관리</div>
    </div>
    <button class="icon-btn" onclick="openSettings()">⚙</button>
  </div>

  <!-- TAB 1: 구매완료 -->
  <div class="tab-panel active" id="panel-1">
    <div class="search-box"><span class="ic">🔍</span><input type="text" id="itemSearch" placeholder="상품명 · 색상 · 구매처 검색" oninput="renderItems()"></div>
    <div class="chip-row" id="itemCatFilter"></div>
    <div id="itemList"></div>
  </div>

  <!-- TAB 2: 주문내역 -->
  <div class="tab-panel" id="panel-2">
    <div class="search-box"><span class="ic">🔍</span><input type="text" id="orderSearch" placeholder="상품명 · 구매처 검색" oninput="renderOrders()"></div>
    <div class="chip-row" id="orderStatusFilter"></div>
    <div id="orderList"></div>
  </div>

  <!-- TAB 3: 견적 계산기 -->
  <div class="tab-panel" id="panel-3">
    <div class="quote-form">
      <div class="field" style="margin-bottom:8px;"><label>상품명</label><input type="text" id="qName" placeholder="예: 니트 원피스"></div>
      <div class="row2">
        <div class="field" style="flex:1; margin-bottom:0;"><label>예상 단가</label><input type="number" id="qPrice" placeholder="0"></div>
        <div class="field" style="width:80px; margin-bottom:0;"><label>수량</label><input type="number" id="qQty" placeholder="1" value="1"></div>
      </div>
      <div class="field" style="margin-top:8px; margin-bottom:0;"><label>구매처 (선택)</label><select id="qWholesaler"><option value="">미지정</option></select></div>
      <button class="btn btn-primary" style="width:100%; margin-top:12px;" onclick="addQuoteItem()">+ 후보에 담기</button>
    </div>
    <div id="quoteList"></div>
    <div id="quoteEmpty" class="empty-state" style="display:none;"><div class="emoji">🧮</div><p>구매 전 후보 상품을 담아보세요</p><p>구매처별로 합계가 자동 계산돼요</p></div>
  </div>

  <!-- TAB 4: 위시리스트 -->
  <div class="tab-panel" id="panel-4">
    <div class="search-box"><span class="ic">🔍</span><input type="text" id="wishSearch" placeholder="상품명 · 구매처 검색" oninput="renderWishes()"></div>
    <div id="wishList"></div>
  </div>

  <!-- TAB 5: 사입삼촌 -->
  <div class="tab-panel" id="panel-5">
    <div class="search-box"><span class="ic">🔍</span><input type="text" id="saipSearch" placeholder="상호명 · 신청일 검색" oninput="renderSaips()"></div>
    <div id="saipList"></div>
  </div>

  <!-- TAB 6: 구매처 -->
  <div class="tab-panel" id="panel-6">
    <div class="search-box"><span class="ic">🔍</span><input type="text" id="wlSearch" placeholder="상호명 또는 건물 검색" oninput="renderWholesalers()"></div>
    <div class="chip-row" id="buildingFilter"></div>
    <div id="wlList"></div>
  </div>

  <div class="fab" id="fabBtn" onclick="handleFab()">+</div>

  <div class="tabbar">
    <button class="tab-btn active" data-tab="1" onclick="switchTab(1)"><span class="t-ic">🛍️</span><span class="t-label">구매완료</span></button>
    <button class="tab-btn" data-tab="2" onclick="switchTab(2)"><span class="t-ic">📦</span><span class="t-label">주문내역</span></button>
    <button class="tab-btn" data-tab="3" onclick="switchTab(3)"><span class="t-ic">🧮</span><span class="t-label">견적계산</span></button>
    <button class="tab-btn" data-tab="4" onclick="switchTab(4)"><span class="t-ic">⭐</span><span class="t-label">위시</span></button>

<script>
/* ============ 데이터 정의 ============ */
const CATEGORIES = {
  "의류": ["상의","원피스","팬츠/레깅스","스커트","아우터","홈웨어/언더웨어"],
  "신발": ["플랫/로퍼","샌들/슬리퍼/쪼리","운동화","부츠"],
  "가방": ["크로스백","숄더백","토트백","클러치/지갑/파우치","백팩"],
  "주얼리": ["귀걸이","목걸이","반지","팔찌/발찌"],
  "잡화": ["헤어액세서리","핸드폰액세서리","여성가방","모자","양말/스타킹","벨트","시계","머플러/스카프","선글라스/안경"]
};
const CAT_COLOR = { "의류": "#F5A8D6", "신발": "#E7A97C", "가방": "#BAA6C1", "주얼리": "#E35BA5", "잡화": "#8FB8D6" };
const BUILDING_COLORS = ["#F5A8D6","#8FB8D6","#E7A97C","#BAA6C1","#7FC7A0","#E35BA5","#C9A6E3"];
const SAIP_FEE_PER_SHOP = 2000;
const SAIP_SHIPPING_FEE = 4000;
const TAB_ACCENT = {
  1: '#c79bd6', // 구매완료: 라벤더
  2: '#F6A8CC', // 주문내역: 핑크
  3: '#9FD8ED', // 견적계산: 하늘색
  4: '#fde6b1', // 위시리스트: 연노랑
  5: '#c5e3a3', // 사입삼촌: 민트
  6: '#FDCFA0'  // 구매처: 피치
};
const TAB_LIGHT = {
  1: '#F3E6FB', // 구매완료: 연한 라벤더
  2: '#E7CCD1', // 주문내역: 연한 핑크
  3: '#EAF7FC', // 견적계산: 연한 하늘색
  4: '#FFF8E8', // 위시리스트: 연한 연노랑
  5: '#EDF7E8', // 사입삼촌: 연한 민트
  6: '#FFF3E7'  // 구매처: 연한 피치
};

let state = {
  items: [],
  wholesalers: [],
  buildings: ["디오트"],
  quotes: [],
  orders: [],
  wishes: [],
  saips: [],
  settings: { binId:"", apiKey:"", lastSync:null }
};

let ui = {
  currentTab: 1,
  itemCatFilter: "전체",
  buildingFilter: "전체",
  orderStatusFilter: "전체",
  editingItemId: null,
  editingWlId: null,
  editingOrderId: null,
  editingWishId: null,
  editingSaipId: null,
  formMajor: null,
  formMinor: null,
  formPhotos: [],
  formPayments: [],
  formOrderBack: false,
  formSaipDaenap: false,
  formSaipWannap: false,
  formSaipRows: [],
  viewingItemId: null,
  viewingWlId: null,
  viewingWishId: null,
  viewingSaipId: null
};

/* ============ 저장/로드 (localStorage) ============ */
function loadLocal(){
  try{
    const raw = localStorage.getItem('wsl_data');
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
      if(!state.buildings || !state.buildings.length) state.buildings = ["디오트"];
      if(!state.orders) state.orders = [];
      if(!state.wishes) state.wishes = [];
      if(!state.saips) state.saips = [];
    }
  }catch(e){ console.error(e); }
}
function saveLocal(){ localStorage.setItem('wsl_data', JSON.stringify(state)); }

/* ============ 초기화 ============ */
function init(){
  loadLocal();
  setAccent(1);
  document.getElementById('s_binId').value = state.settings.binId || "";
  document.getElementById('s_apiKey').value = state.settings.apiKey || "";
  updateSyncInfo();
  buildMajorCatChips();
  renderItemCatFilter();
  renderBuildingFilter();
  renderOrderStatusFilter();
  renderItems();
  renderWholesalers();
  renderQuoteWholesalerOptions();
  renderQuotes();
  renderOrders();
  renderWishes();
  renderSaips();
  if(state.settings.binId && state.settings.apiKey){ pullFromCloud(false); }
}

/* ============ 탭 전환 ============ */
function switchTab(n){
  ui.currentTab = n;
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+n).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.tab-btn[data-tab="'+n+'"]').classList.add('active');
  document.getElementById('fabBtn').style.display = (n===3) ? 'none' : 'flex';
  setAccent(n);
}
function setAccent(n){
  document.body.style.setProperty('--accent', TAB_ACCENT[n] || TAB_ACCENT[1]);
  document.body.style.setProperty('--modal-bg', TAB_LIGHT[n] || TAB_LIGHT[1]);
}
function handleFab(){
  if(ui.currentTab === 1) openItemModal();
  else if(ui.currentTab === 2) openOrderModal();
  else if(ui.currentTab === 4) openWishModal();
  else if(ui.currentTab === 5) openSaipModal();
  else if(ui.currentTab === 6) openWholesalerModal();
}

/* ============ 공통 ============ */
function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }
function showToast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 1800); }
function fmtMoney(n){ n = Number(n)||0; return n.toLocaleString('ko-KR') + '원'; }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return String(s).replace(/'/g,"\\'"); }

/* ============ TAB1: 상품 카테고리 필터 칩 ============ */
function renderItemCatFilter(){
  const wrap = document.getElementById('itemCatFilter');
  const cats = ["전체", ...Object.keys(CATEGORIES)];
  wrap.innerHTML = cats.map(c=>`<div class="chip ${ui.itemCatFilter===c?'active':''}" onclick="setItemCatFilter('${c}')">${c}</div>`).join('');
}
function setItemCatFilter(c){ ui.itemCatFilter = c; renderItemCatFilter(); renderItems(); }

/* ============ TAB1: 상품 리스트 렌더 ============ */
function renderItems(){
  const q = document.getElementById('itemSearch').value.trim().toLowerCase();
  let list = state.items.slice().sort((a,b)=> (b.purchaseDate||'').localeCompare(a.purchaseDate||''));
  if(ui.itemCatFilter !== '전체') list = list.filter(it=> it.category === ui.itemCatFilter);
  if(q) list = list.filter(it=> (it.name||'').toLowerCase().includes(q) || (it.color||'').toLowerCase().includes(q) || (it.wholesaler||'').toLowerCase().includes(q));
  const wrap = document.getElementById('itemList');
  if(list.length === 0){ wrap.innerHTML = `<div class="empty-state"><div class="emoji">🛍️</div><p>등록된 상품이 없어요</p><p>+ 버튼으로 구매 상품을 추가해보세요</p></div>`; return; }
  wrap.innerHTML = list.map(it=>{
    const color = CAT_COLOR[it.category] || '#BAA6C1';
    const thumb = it.photos && it.photos[0] ? `<img class="item-thumb" src="${it.photos[0]}">` : `<div class="item-thumb empty" style="background:linear-gradient(135deg, ${color}, #fff2)">👗</div>`;
    return `<div class="item-card" onclick="openItemDetail('${it.id}')">${thumb}
      <div class="item-info">
        <div class="item-top"><span class="cat-badge" style="background:${color}">${it.category}${it.subcategory? ' · '+it.subcategory:''}</span></div>
        <div class="item-name">${escapeHtml(it.name||'(이름없음)')}</div>
        <div class="item-meta">${escapeHtml(it.wholesaler||'-')} · ${it.purchaseDate||'-'}</div>
        <div class="item-price">${fmtMoney(it.price)}</div>
      </div></div>`;
  }).join('');
}

/* ============ TAB1: 상품 등록/수정 모달 ============ */
function buildMajorCatChips(){
  document.getElementById('majorCatGroup').innerHTML = Object.keys(CATEGORIES).map(c=>`<div class="select-chip" data-major="${c}" onclick="selectMajor('${c}')">${c}</div>`).join('');
}
function selectMajor(c){
  ui.formMajor = c; ui.formMinor = null;
  document.querySelectorAll('#majorCatGroup .select-chip').forEach(el=> el.classList.toggle('sel', el.dataset.major === c));
  renderMinorChips();
}
function renderMinorChips(){
  const wrap = document.getElementById('minorCatGroup');
  if(!ui.formMajor){ wrap.innerHTML = '<span style="font-size:12px;color:#b2b2c2;">대분류를 먼저 선택하세요</span>'; return; }
  const subs = CATEGORIES[ui.formMajor] || [];
  wrap.innerHTML = subs.map(s=>`<div class="select-chip" data-minor="${s}" onclick="selectMinor('${s}')">${s}</div>`).join('');
}
function selectMinor(s){
  ui.formMinor = s;
  document.querySelectorAll('#minorCatGroup .select-chip').forEach(el=> el.classList.toggle('sel', el.dataset.minor === s));
}
function wholesalerOptionsHtml(selected){
  return '<option value="">선택 안함</option>' + state.wholesalers.map(w=>`<option value="${escapeHtml(w.name)}" ${w.name===selected?'selected':''}>${escapeHtml(w.name)}</option>`).join('');
}

  e.target.value = '';
}
function compressImage(file, cb){
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = function(){
      const maxW = 700; const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale; canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      cb(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function calcSaipFee(rows){
  const itemTotal = rows.reduce((s,r)=> s + (Number(r.price)||0), 0);
  const shopSet = new Set(rows.map(r=> (r.shopName||'').trim()).filter(Boolean));
  const shopCount = shopSet.size;
  const fee = shopCount * SAIP_FEE_PER_SHOP + (rows.length ? SAIP_SHIPPING_FEE : 0);
  return { itemTotal, shopCount, fee, grandTotal: itemTotal + fee };
}

  const data = { applyDate: document.getElementById('sp_date').value, items, daenap: ui.formSaipDaenap, wannap: ui.formSaipWannap };
  if(ui.editingSaipId){ const idx = state.saips.findIndex(s=>s.id===ui.editingSaipId); state.saips[idx] = Object.assign(state.saips[idx], data); }
  else { data.id = crypto.randomUUID(); state.saips.push(data); }
  saveLocal(); renderSaips(); closeModal('saipModal'); showToast('저장했어요'); pushToCloud();
}
function deleteCurrentSaip(){
  if(!ui.editingSaipId) return;
  if(!confirm('이 사입 신청건을 삭제할까요?')) return;
  state.saips = state.saips.filter(s=>s.id!==ui.editingSaipId);
  saveLocal(); renderSaips(); closeModal('saipModal'); showToast('삭제했어요'); pushToCloud();
}
function renderSaips(){
  const q = document.getElementById('saipSearch').value.trim().toLowerCase();
  let list = state.saips.slice().sort((a,b)=> (b.applyDate||'').localeCompare(a.applyDate||''));
  if(q) list = list.filter(s=> (s.applyDate||'').includes(q) || (s.items||[]).some(it=>(it.shopName||'').toLowerCase().includes(q)));
  const wrap = document.getElementById('saipList');
  if(list.length===0){ wrap.innerHTML = `<div class="empty-state"><div class="emoji">🧾</div><p>등록된 사입 신청이 없어요</p><p>+ 버튼으로 신청건을 추가해보세요</p></div>`; return; }
  wrap.innerHTML = list.map(s=>{
    const r = calcSaipFee(s.items||[]);
    let badges = '';
    if(s.daenap) badges += `<span class="b-daenap">대납</span>`;
    if(s.wannap) badges += `<span class="b-wannap">완납</span>`;
    if(!s.daenap && !s.wannap) badges += `<span class="b-none">미정산</span>`;
    return `<div class="saip-card" onclick="openSaipDetail('${s.id}')">
      <div class="saip-top"><span class="saip-date">${s.applyDate||'날짜 미지정'}</span><span class="saip-badges">${badges}</span></div>
      <div class="saip-meta">상품 ${((s.items||[]).length)}건 · 거래처 ${r.shopCount}곳</div>
      <div class="saip-total">${fmtMoney(r.grandTotal)}</div>
    </div>`;
  }).join('');
}
function openSaipDetail(id){
  const s = state.saips.find(x=>x.id===id); if(!s) return;
  ui.viewingSaipId = id;
  const r = calcSaipFee(s.items||[]);
  const itemsHtml = (s.items||[]).map(it=>{
    const opt = [it.color, it.size].filter(Boolean).join(' / ');
    const loc = [it.building, it.floor, it.unit].filter(Boolean).join(' ');
    return `<div class="sit-row">
      <div class="sit-name">${escapeHtml(it.name)} · ${fmtMoney(it.price)}</div>
      <div class="sit-sub">${opt ? escapeHtml(opt)+' · ' : ''}${escapeHtml(it.shopName||'-')} ${loc ? '('+escapeHtml(loc)+')' : ''}</div>
    </div>`;
  }).join('');
  let badges = '';
  if(s.daenap) badges += `<span class="b-daenap">대납</span>`;
  if(s.wannap) badges += `<span class="b-wannap">완납</span>`;
  if(!s.daenap && !s.wannap) badges += `<span class="b-none">미정산</span>`;
  document.getElementById('saipDetailBody').innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <span style="font-size:16px; font-weight:800; color:var(--navy);">${s.applyDate||'날짜 미지정'}</span>
      <span>${badges}</span>
    </div>
    <div class="saip-item-table">${itemsHtml}</div>
    <div class="fee-box" style="margin-top:12px;">
      <div class="fee-row"><span>상품 금액 합계</span><span>${fmtMoney(r.itemTotal)}</span></div>
      <div class="fee-row"><span>거래처 수수료 (${r.shopCount}곳 × 2,000원)</span><span>${fmtMoney(r.shopCount*SAIP_FEE_PER_SHOP)}</span></div>
      <div class="fee-row"><span>택배비</span><span>${fmtMoney((s.items||[]).length?SAIP_SHIPPING_FEE:0)}</span></div>
      <div class="fee-row total"><span>총 결제금액</span><span>${fmtMoney(r.grandTotal)}</span></div>
    </div>`;
  openModal('saipDetailModal');
}
function editCurrentSaip(){ closeModal('saipDetailModal'); openSaipEdit(ui.viewingSaipId); }

/* ============ TAB6: 건물 필터 / 구매처 리스트 ============ */
function renderBuildingFilter(){
  const wrap = document.getElementById('buildingFilter');
  const list = ["전체", ...state.buildings];
  wrap.innerHTML = list.map(b=>`<div class="chip ${ui.buildingFilter===b?'active':''}" onclick="setBuildingFilter('${escAttr(b)}')">${b}</div>`).join('') + `<div class="chip add-chip" onclick="openModal('buildingModal')">+ 건물추가</div>`;
}
function setBuildingFilter(b){ ui.buildingFilter = b; renderBuildingFilter(); renderWholesalers(); }
function addBuilding(){
  const name = document.getElementById('newBuildingName').value.trim();
  if(!name){ showToast('건물명을 입력해주세요'); return; }
  if(state.buildings.includes(name)){ showToast('이미 있는 건물이에요'); return; }
  state.buildings.push(name); saveLocal();
  document.getElementById('newBuildingName').value = '';
  renderBuildingFilter(); renderBuildingSelect(); closeModal('buildingModal'); showToast('건물을 추가했어요'); pushToCloud();
}
function buildingColor(name){
  let hash = 0; for(let i=0;i<name.length;i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);
  return BUILDING_COLORS[Math.abs(hash) % BUILDING_COLORS.length];
}
function renderWholesalers(){
  const q = document.getElementById('wlSearch').value.trim().toLowerCase();
  let list = state.wholesalers.slice().sort((a,b)=> (a.name||'').localeCompare(b.name||''));
  if(ui.buildingFilter !== '전체') list = list.filter(w=> w.building === ui.buildingFilter);
  if(q) list = list.filter(w=> (w.name||'').toLowerCase().includes(q) || (w.building||'').toLowerCase().includes(q));
  const wrap = document.getElementById('wlList');
  if(list.length===0){ wrap.innerHTML = `<div class="empty-state"><div class="emoji">🏬</div><p>등록된 구매처가 없어요</p><p>+ 버튼으로 구매처를 추가해보세요</p></div>`; return; }
  wrap.innerHTML = list.map(w=>`
    <div class="wl-card" onclick="openWlDetail('${w.id}')">
      <div class="wl-dot" style="background:${buildingColor(w.building||'')}"></div>
      <div class="wl-text"><div class="wl-name">${escapeHtml(w.name)}</div><div class="wl-loc">${escapeHtml(w.building||'-')} ${escapeHtml(w.floor||'')} ${escapeHtml(w.unit||'')}</div></div>
      <div class="wl-arrow">›</div>
    </div>`).join('');
}
function renderBuildingSelect(selected){
  const sel = document.getElementById('w_building');
  sel.innerHTML = state.buildings.map(b=>`<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');
  if(selected) sel.value = selected;
}
function togglePayment(el){
  el.classList.toggle('sel');
  const pay = el.dataset.pay;
  if(ui.formPayments.includes(pay)) ui.formPayments = ui.formPayments.filter(p=>p!==pay);
  else ui.formPayments.push(pay);
}
function openWholesalerModal(){
  ui.editingWlId = null; ui.formPayments = [];
  document.getElementById('wlModalTitle').textContent = '구매처 등록';
  document.getElementById('wlDeleteBtn').style.display = 'none';
  document.getElementById('w_name').value = '';
  document.getElementById('w_floor').value = '';
  document.getElementById('w_unit').value = '';
  document.getElementById('w_account').value = '';
  document.getElementById('w_memo').value = '';
  document.querySelectorAll('#paymentGroup .select-chip').forEach(el=>el.classList.remove('sel'));
  renderBuildingSelect();
  openModal('wlModal');
}
function openWlEdit(id){
  const w = state.wholesalers.find(x=>x.id===id); if(!w) return;
  ui.editingWlId = id; ui.formPayments = (w.payment||[]).slice();
  document.getElementById('wlModalTitle').textContent = '구매처 수정';
  document.getElementById('wlDeleteBtn').style.display = 'block';
  document.getElementById('w_name').value = w.name||'';
  document.getElementById('w_floor').value = w.floor||'';
  document.getElementById('w_unit').value = w.unit||'';
  document.getElementById('w_account').value = w.account||'';
  document.getElementById('w_memo').value = w.memo||'';
  renderBuildingSelect(w.building);
  document.querySelectorAll('#paymentGroup .select-chip').forEach(el=> el.classList.toggle('sel', ui.formPayments.includes(el.dataset.pay)));
  openModal('wlModal');
}
function saveWholesaler(){
  const name = document.getElementById('w_name').value.trim();
  if(!name){ showToast('상호명을 입력해주세요'); return; }
  const data = {
    name, building: document.getElementById('w_building').value,
    floor: document.getElementById('w_floor').value.trim(), unit: document.getElementById('w_unit').value.trim(),
    payment: ui.formPayments.slice(), account: document.getElementById('w_account').value.trim(),
    memo: document.getElementById('w_memo').value.trim()
  };
  if(ui.editingWlId){ const idx = state.wholesalers.findIndex(w=>w.id===ui.editingWlId); state.wholesalers[idx] = Object.assign(state.wholesalers[idx], data); }
  else { data.id = crypto.randomUUID(); state.wholesalers.push(data); }
  saveLocal(); renderWholesalers(); renderQuoteWholesalerOptions(); closeModal('wlModal'); showToast('저장했어요'); pushToCloud();
}
function deleteCurrentWholesaler(){
  if(!ui.editingWlId) return;
  if(!confirm('이 구매처를 삭제할까요?')) return;
  state.wholesalers = state.wholesalers.filter(w=>w.id!==ui.editingWlId);
  saveLocal(); renderWholesalers(); renderQuoteWholesalerOptions(); closeModal('wlModal'); showToast('삭제했어요'); pushToCloud();
}
function openWlDetail(id){
  const w = state.wholesalers.find(x=>x.id===id); if(!w) return;
  ui.viewingWlId = id;
  const payHtml = (w.payment&&w.payment.length) ? w.payment.map(p=>`<span class="badge-pay">${p}</span>`).join('') : '<span style="font-size:12.5px;color:#b2b2c2;">등록된 결제방법 없음</span>';
  document.getElementById('wlDetailBody').innerHTML = `
    <div style="font-size:20px; font-weight:800; color:var(--navy); margin-bottom:4px;">${escapeHtml(w.name)}</div>
    <div style="font-size:12px; color:var(--gray); margin-bottom:16px;">${escapeHtml(w.building||'-')} ${escapeHtml(w.floor||'')} ${escapeHtml(w.unit||'')}</div>
    <div class="detail-row"><span class="k">건물</span><span class="v">${escapeHtml(w.building||'-')}</span></div>
    <div class="detail-row"><span class="k">층</span><span class="v">${escapeHtml(w.floor||'-')}</span></div>
    <div class="detail-row"><span class="k">호</span><span class="v">${escapeHtml(w.unit||'-')}</span></div>
    <div style="margin-top:12px;"><div style="font-size:12px; color:var(--gray); font-weight:600; margin-bottom:6px;">결제방법</div>${payHtml}</div>
    <div style="margin-top:14px;"><div style="font-size:12px; color:var(--gray); font-weight:600; margin-bottom:6px;">계좌번호</div>
      <div class="account-box"><span class="num">${escapeHtml(w.account||'등록된 계좌 없음')}</span>${w.account ? `<button class="copy-btn" onclick="copyAccount('${escAttr(w.account)}')">복사</button>` : ''}</div>
    </div>
    ${w.memo ? `<div style="margin-top:14px;"><div style="font-size:12px;color:var(--gray);font-weight:600;margin-bottom:4px;">메모</div><div style="font-size:13px;color:var(--navy);">${escapeHtml(w.memo)}</div></div>` : ''}`;
  openModal('wlDetailModal');
}
function editCurrentWholesaler(){ closeModal('wlDetailModal'); openWlEdit(ui.viewingWlId); }
function copyAccount(acc){ navigator.clipboard.writeText(acc).then(()=>showToast('계좌번호를 복사했어요')); }

/* ============ TAB3: 견적 계산기 ============ */
function renderQuoteWholesalerOptions(){
  const sel = document.getElementById('qWholesaler');
  sel.innerHTML = '<option value="">미지정</option>' + state.wholesalers.map(w=>`<option value="${escapeHtml(w.name)}">${escapeHtml(w.name)}</option>`).join('');
}
function addQuoteItem(){
  const name = document.getElementById('qName').value.trim();
  const price = Number(document.getElementById('qPrice').value)||0;
  const qty = Number(document.getElementById('qQty').value)||1;
  const wholesaler = document.getElementById('qWholesaler').value;
  if(!name){ showToast('상품명을 입력해주세요'); return; }
  state.quotes.push({ id: crypto.randomUUID(), name, price, qty, wholesaler });
  saveLocal();
  document.getElementById('qName').value=''; document.getElementById('qPrice').value=''; document.getElementById('qQty').value='1'; document.getElementById('qWholesaler').value='';
  renderQuotes(); pushToCloud();
}
function removeQuoteItem(id){ state.quotes = state.quotes.filter(q=>q.id!==id); saveLocal(); renderQuotes(); pushToCloud(); }
function renderQuotes(){
  const wrap = document.getElementById('quoteList'); const emptyEl = document.getElementById('quoteEmpty');
  if(state.quotes.length===0){ wrap.innerHTML = ''; emptyEl.style.display = 'block'; removeTotalBar(); return; }
  emptyEl.style.display = 'none';
  const groups = {};
  state.quotes.forEach(q=>{ const key = q.wholesaler || '미지정'; if(!groups[key]) groups[key] = []; groups[key].push(q); });
  let html = ''; let grandTotal = 0;
  Object.keys(groups).forEach(key=>{
    const items = groups[key]; let subtotal = 0;
    let itemsHtml = items.map(q=>{
      const lineTotal = q.price * q.qty; subtotal += lineTotal;
      return `<div class="quote-item"><div class="qi-info"><div class="qi-name">${escapeHtml(q.name)}</div><div class="qi-sub">${fmtMoney(q.price)} × ${q.qty}</div></div><div class="qi-total">${fmtMoney(lineTotal)}</div><button class="qi-del" onclick="removeQuoteItem('${q.id}')">✕</button></div>`;
    }).join('');
    grandTotal += subtotal;
    html += `<div class="quote-group"><div class="quote-group-head"><span>${escapeHtml(key)}</span><span class="sub-total">${fmtMoney(subtotal)}</span></div>${itemsHtml}</div>`;
  });
  wrap.innerHTML = html;
  renderTotalBar(grandTotal);
}
function renderTotalBar(total){
  let bar = document.getElementById('quoteTotalBar');
  if(!bar){ bar = document.createElement('div'); bar.id = 'quoteTotalBar'; bar.className = 'quote-total-bar'; document.getElementById('panel-3').appendChild(bar); }
  bar.innerHTML = `<div><div class="label">총 합계 (${state.quotes.length}개)</div><div class="amount">${fmtMoney(total)}</div></div><button onclick="clearQuotes()">전체 초기화</button>`;
}
function removeTotalBar(){ const bar = document.getElementById('quoteTotalBar'); if(bar) bar.remove(); }
function clearQuotes(){ if(!confirm('후보 리스트를 모두 지울까요?')) return; state.quotes = []; saveLocal(); renderQuotes(); pushToCloud(); }

/* ============ 설정 / JSONBin 동기화 ============ */
function openSettings(){
  document.getElementById('s_binId').value = state.settings.binId || "";
  document.getElementById('s_apiKey').value = state.settings.apiKey || "";
  updateSyncInfo(); openModal('settingsModal');
}
function updateSyncInfo(){
  document.getElementById('syncInfo').textContent = state.settings.lastSync ? `마지막 동기화: ${new Date(state.settings.lastSync).toLocaleString('ko-KR')}` : '아직 동기화하지 않았어요';
}
function saveSettingsAndPush(){
  state.settings.binId = document.getElementById('s_binId').value.trim();
  state.settings.apiKey = document.getElementById('s_apiKey').value.trim();
  saveLocal();
  if(state.settings.binId && state.settings.apiKey) pushToCloud(true);
  closeModal('settingsModal');
}
async function pushToCloud(silent){
  if(!state.settings.binId || !state.settings.apiKey) return;
  try{
    const payload = { items: state.items, wholesalers: state.wholesalers, buildings: state.buildings, quotes: state.quotes, orders: state.orders, wishes: state.wishes, saips: state.saips };
    const res = await fetch('https://api.jsonbin.io/v3/b/'+state.settings.binId, {
      method:'PUT', headers:{ 'Content-Type':'application/json', 'X-Master-Key': state.settings.apiKey }, body: JSON.stringify(payload)
    });
    if(res.ok){ state.settings.lastSync = Date.now(); saveLocal(); updateSyncInfo(); if(!silent) showToast('클라우드에 저장했어요'); }
    else { if(!silent) showToast('동기화 실패 (Bin ID/Key 확인)'); }
  }catch(e){ if(!silent) showToast('네트워크 오류로 동기화 실패'); }
}
async function pullFromCloud(manual){
  if(!state.settings.binId){ if(manual) showToast('Bin ID를 먼저 입력해주세요'); return; }
  const key = document.getElementById('s_apiKey').value.trim() || state.settings.apiKey;
  const binId = document.getElementById('s_binId').value.trim() || state.settings.binId;
  try{
    const res = await fetch('https://api.jsonbin.io/v3/b/'+binId+'/latest', { headers: key ? { 'X-Master-Key': key } : {} });
    if(res.ok){
      const json = await res.json(); const rec = json.record || {};
      state.items = rec.items || []; state.wholesalers = rec.wholesalers || [];
      state.buildings = rec.buildings && rec.buildings.length ? rec.buildings : ["디오트"];
      state.quotes = rec.quotes || []; state.orders = rec.orders || []; state.wishes = rec.wishes || []; state.saips = rec.saips || [];
      state.settings.binId = binId; state.settings.apiKey = key; state.settings.lastSync = Date.now();
      saveLocal();
      renderItemCatFilter(); renderBuildingFilter(); renderOrderStatusFilter();
      renderItems(); renderWholesalers(); renderQuoteWholesalerOptions(); renderQuotes();
      renderOrders(); renderWishes(); renderSaips(); updateSyncInfo();
      if(manual) showToast('클라우드에서 가져왔어요');
    } else { if(manual) showToast('가져오기 실패 (Bin ID/Key 확인)'); }
  }catch(e){ if(manual) showToast('네트워크 오류'); }
}

window.addEventListener('DOMContentLoaded', init);
</script>
